<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager | JavaScript</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>&#9745; Task Manager</h1>
      <p id="today"></p>
    </header>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="120" autocomplete="off">
      <select id="priorityInput" title="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit" id="addBtn">Add Task</button>
    </form>
    <p id="formError" class="form-error"></p>

    <div class="toolbar">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="pending">Pending</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <span id="counter" class="counter"></span>
    </div>

    <ul id="taskList" class="task-list"></ul>
    <p id="emptyState" class="empty">No tasks here. Add one above!</p>

    <footer class="app-footer">
      <button id="clearCompleted" class="link-btn">Clear completed</button>
      <small>Tasks are saved in your browser (localStorage)</small>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
